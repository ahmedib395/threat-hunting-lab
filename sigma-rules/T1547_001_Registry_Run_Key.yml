title: Registry Run Key Modification for Persistence
id: 9k0l1m2n-3456-7890-nopq-123456789012
description: Detects modifications to HKLM or HKCU Run registry keys for persistence
logsource:
  product: windows
  service: sysmon
  event_id: 13
detection:
  selection:
    TargetObject|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
  condition: selection
fields:
  - TargetObject
  - Details
  - Image
  - User
falsepositives:
  - Legitimate software installations
level: high
tags:
  - attack.persistence
  - attack.t1547.001