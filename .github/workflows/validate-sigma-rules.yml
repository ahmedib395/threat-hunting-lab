name: Validate Sigma Rules

on:
  push:
    branches:
      - main
    paths:
      - 'sigma-rules/**'
  pull_request:
    paths:
      - 'sigma-rules/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python -c "
          import yaml
          import glob
          import sys
          for file in glob.glob('sigma-rules/*.yml'):
              try:
                  with open(file) as f:
                      yaml.safe_load(f)
                  print(f'✓ {file}')
              except Exception as e:
                  print(f'✗ {file}: {e}')
                  sys.exit(1)
          print('All rules validated!')
          "