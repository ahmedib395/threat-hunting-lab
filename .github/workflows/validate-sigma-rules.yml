name: Validate and Convert Sigma Rules

on:
  push:
    branches:
      - main
    paths:
      - 'sigma-rules/**'
  pull_request:
    paths:
      - 'sigma-rules/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Convert Sigma Rules to Wazuh XML
        run: |
          mkdir -p output
          # IMPORTANT: Change this filename to match your exact python script name!
          python sigma_to_wazuh_converter.py > output/converted_rules.xml
          cat output/converted_rules.xml

      - name: Upload Wazuh XML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-xml-rules
          path: output/converted_rules.xml
