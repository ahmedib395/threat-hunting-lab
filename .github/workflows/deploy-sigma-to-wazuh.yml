name: Deploy Sigma Rules to Wazuh

on:
  push:
    branches:
      - main
    paths:
      - 'sigma-rules/**'

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Validate Sigma rules
        run: |
          python -c "
          import yaml
          import glob
          for file in glob.glob('sigma-rules/*.yml'):
              with open(file) as f:
                  yaml.safe_load(f)
              print(f'✓ {file}')
          "

      - name: Convert Sigma to Wazuh format
        run: python sigma_to_wazuh_converter.py > wazuh_rules.xml

      - name: Deploy to Wazuh
        run: python deploy_to_wazuh.py
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_USERNAME: ${{ secrets.WAZUH_USERNAME }}
          WAZUH_PASSWORD: ${{ secrets.WAZUH_PASSWORD }}

      - name: Upload rules artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-rules
          path: wazuh_rules.xml