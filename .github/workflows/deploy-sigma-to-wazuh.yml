name: Sigma to Wazuh CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'sigma-rules/**'
  pull_request:
    paths:
      - 'sigma-rules/**'

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Sigma YAML syntax
        run: |
          python -c "
          import yaml
          import glob
          for file in glob.glob('sigma-rules/*.yml'):
              with open(file) as f:
                  yaml.safe_load(f)
              print(f'✓ {file}')
          print('All rules validated!')
          "

      - name: Convert Sigma to Wazuh XML
        run: python sigma_to_wazuh_converter.py > wazuh_rules.xml

      - name: Display converted rules
        run: head -50 wazuh_rules.xml

      - name: Upload Wazuh rules artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-sigma-rules
          path: wazuh_rules.xml
          retention-days: 30